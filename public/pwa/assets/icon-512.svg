<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ПЛ">
  <!-- Иконка PWA: квадрат с логотипом ПЛ -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect x="14" y="14" width="484" height="484" rx="84" fill="none" stroke="#000000" stroke-width="10"/>

  <!-- Эмблема: оригинальные пути дизайнера, отцентрированы в квадрате.
       Оригинал: X 287-513, Y 30-150 (центр 400,90).
       Transform scale(1.7) + translate(-424,103) → центр в (256,256). -->
  <g id="logo-emblem" transform="translate(-424, 103) scale(1.7)">
    <!-- Чёрная буква "П" (наклон 18° / коэффициент 0.3, горизонтальная толщина стоек 35px) -->
    <path d="M 287,150 L 323,30 L 423,30 L 387,150 L 352,150 L 377.5,65 L 347.5,65 L 322,150 Z" fill="#1A1A1A" />

    <!-- Красная буква "Л" (параллельный зазор 15px, толщина стоек 25px) -->
    <path d="M 402,150 L 438,30 L 513,150 L 488,150 L 446.8,84 L 427,150 Z" fill="#E31E24" />
  </g>

  <!-- Красная полоса-акцент снизу -->
  <rect x="120" y="436" width="272" height="16" rx="4" fill="#E31E24"/>
</svg>
