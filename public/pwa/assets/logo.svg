<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" role="img" aria-label="Парфюм Логистик">
  <!-- Логотип ПЛ: монограмма (оригинальные пути дизайнера) + текст.
       Оригинал букв: X 287-513 (226px), Y 30-150 (120px), центр (400,90).
       Transform scale(0.65) + translate(-166.5, 0.5) → буквы в области (20,20)-(167,98). -->
  <g id="logo-emblem" transform="translate(-166.5, 0.5) scale(0.65)">
    <!-- Чёрная буква "П" (наклон 18° / коэффициент 0.3, толщина стоек 35px) -->
    <path d="M 287,150 L 323,30 L 423,30 L 387,150 L 352,150 L 377.5,65 L 347.5,65 L 322,150 Z" fill="#1A1A1A" />

    <!-- Красная буква "Л" (параллельный зазор 15px, толщина стоек 25px) -->
    <path d="M 402,150 L 438,30 L 513,150 L 488,150 L 446.8,84 L 427,150 Z" fill="#E31E24" />
  </g>

  <!-- Текст -->
  <text x="184" y="56" font-family="'Segoe UI','Roboto',Arial,sans-serif" font-size="30" font-weight="800" fill="#1A1A1A">Парфюм</text>
  <text x="184" y="92" font-family="'Segoe UI','Roboto',Arial,sans-serif" font-size="30" font-weight="800" fill="#E31E24">Логистик</text>

  <!-- Красная полоса-акцент снизу -->
  <rect x="184" y="103" width="170" height="5" rx="2" fill="#E31E24"/>
</svg>
